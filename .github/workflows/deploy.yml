name: Publish to GitHub Pages

# Publication is intentional: pushes and pull requests never deploy the site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, verify, and package the static site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@11.20.0
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
